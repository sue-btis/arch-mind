openapi: 3.1.0
info:
  title: arch-mind local API
  version: 0.1.0
  description: >
    JSON API between the Study UI and the local server, served on 127.0.0.1 only.
    Every request must carry a localhost Host header; requests with a foreign Origin
    and non-JSON bodies are rejected with 403 or 415 (ADR-005).
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "4417"
        description: Chosen at start; printed by the arch-mind command.
paths:
  /api/concepts:
    get:
      summary: All valid concepts plus files that could not be read
      description: >
        Reloads the store folder so hand edits appear (FR-016, FR-017). A concept whose
        illustration link or SVG is invalid, has more than one illustration link, or names an
        unknown pictogram is still returned (without its illustration, or with its layer's
        pictogram) and the file is also listed in problems (ADR-009).
      operationId: listConcepts
      responses:
        "200":
          description: Concepts and problems
          content:
            application/json:
              schema:
                type: object
                required: [concepts, problems]
                properties:
                  concepts:
                    type: array
                    items: { $ref: "#/components/schemas/Concept" }
                  problems:
                    type: array
                    items: { $ref: "#/components/schemas/FileProblem" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/concepts/{id}:
    get:
      summary: One concept with the review state of each recall question
      operationId: getConcept
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      responses:
        "200":
          description: Concept detail (FR-025)
          content:
            application/json:
              schema:
                type: object
                required: [concept, questions]
                properties:
                  concept: { $ref: "#/components/schemas/Concept" }
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/QuestionState" }
        "404":
          description: No such concept
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/concepts/{id}/illustration:
    get:
      summary: The concept's visual illustration as an SVG image
      description: >
        Served as a file, not inside the concept payload, so the UI can show it only as an
        image (img) and never inline it. The SVG was validated against the allowlist by the
        rules module (ADR-009); the headers below are a second barrier if the URL is opened
        directly.
      operationId: getConceptIllustration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      responses:
        "200":
          description: The illustration (FR-025)
          headers:
            Content-Security-Policy:
              description: Blocks scripts, external loads and framing of the SVG.
              schema: { type: string, const: "default-src 'none'; style-src 'unsafe-inline'; sandbox" }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/svg+xml:
              schema: { type: string }
        "404":
          description: No such concept, or the concept has no valid illustration
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/facets:
    get:
      summary: Facet catalog for the view filters (FR-018)
      operationId: getFacets
      responses:
        "200":
          description: Layers plus the configured domains and concerns
          content:
            application/json:
              schema:
                type: object
                required: [layers, domains, concerns]
                properties:
                  layers:
                    type: array
                    items: { enum: [client, network, server, data] }
                  domains: { type: array, items: { type: string } }
                  concerns: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/reviews/due:
    get:
      summary: Recall questions due today (FR-026)
      operationId: listDue
      responses:
        "200":
          description: Due questions with their concept id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuestionState" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/reviews:
    post:
      summary: Record one review; appends one line to the review log (FR-027 to FR-029, FR-032)
      operationId: recordReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, result]
              properties:
                question:
                  type: string
                  pattern: "^[a-z0-9]+(-[a-z0-9]+)*#q[0-9]+$"
                result:
                  enum: [right, wrong]
      responses:
        "201":
          description: Recorded; returns the question's new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionState" }
        "404":
          description: No such recall question
        "403": { $ref: "#/components/responses/Forbidden" }
        "415":
          description: Body is not application/json
components:
  responses:
    Forbidden:
      description: Foreign Host or Origin (ADR-005)
  schemas:
    Concept:
      description: >
        Shape defined in docs/design/data/concept.schema.json, including the optional
        pictogram id (the UI shows the layer's pictogram when it is absent or no longer in
        the library, FR-038), plus the derived hasIllustration flag. seeI.illustration is
        returned without the Markdown image link (stripped server-side); the UI shows the
        image only through GET /api/concepts/{id}/illustration (ADR-009).
      type: object
      required: [hasIllustration]
      properties:
        pictogram: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        hasIllustration:
          type: boolean
          description: Derived by the rules module; not stored. True when GET /api/concepts/{id}/illustration answers 200.
    FileProblem:
      type: object
      required: [file, reason]
      properties:
        file: { type: string }
        reason: { type: string }
    QuestionState:
      type: object
      required: [question, conceptId, text, box, due]
      properties:
        question: { type: string, description: "'<concept id>#<recall question id>'" }
        conceptId: { type: string }
        text: { type: string }
        box: { type: integer, minimum: 1 }
        due: { type: string, format: date }
